name: Security Scan

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - '.github/workflows/security-scan.yml'
  schedule:
    # 每周一凌晨3点运行
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      severity:
        description: '漏洞严重级别'
        required: false
        default: 'CRITICAL,HIGH'
        type: choice
        options:
          - 'CRITICAL'
          - 'CRITICAL,HIGH'
          - 'CRITICAL,HIGH,MEDIUM'
          - 'CRITICAL,HIGH,MEDIUM,LOW'
      ignore_unfixed:
        description: '忽略未修复的漏洞'
        required: false
        default: true
        type: boolean
      exit_code:
        description: '发现漏洞时退出码'
        required: false
        default: '1'
        type: choice
        options:
          - '0'
          - '1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TRIVY_VERSION: 0.69.3

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true                      # <<< 把镜像加载到 runner 的 docker daemon，以便后续扫描
          tags: |
            local-build:latest
          build-args: |
            UBUNTU_VERSION=24.04
            JAVA_VERSION=17
            PYTHON_VERSION=3.12
            ANDROID_SDK_VERSION=34
            ANDROID_NDK_VERSION=r26
            GRADLE_VERSION=8.5
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 不再手动 wget/tar 安装 Trivy（使用下方的 trivy-action）
      # - name: Install Trivy
      #   ...

      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        uses: aquasecurity/trivy-action@v0.69.3
        with:
          image-ref: 'local-build:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ github.event.inputs.severity || 'CRITICAL,HIGH' }}
          ignore-unfixed: ${{ github.event.inputs.ignore_unfixed || true }}
          exit-code: ${{ github.event.inputs.exit_code || '1' }}
          vuln-type: 'os,library'
          scanners: 'vuln'
          timeout: '10m'

      - name: Check for SARIF file
        id: check-sarif
        run: |
          if [ -f "trivy-results.sarif" ]; then
            echo "sarif_exists=true" >> $GITHUB_OUTPUT
          else
            echo "sarif_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: steps.check-sarif.outputs.sarif_exists == 'true'
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-security'

      - name: Run Trivy configuration scan
        id: trivy-config
        uses: aquasecurity/trivy-action@v0.69.3
        if: always()
        with:
          image-ref: 'local-build:latest'
          format: 'table'
          output: 'trivy-config.txt'
          scanners: 'misconfig'           # 使用 misconfig 替代已弃用的 config
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          timeout: '5m'

      - name: Run Trivy secret scan
        id: trivy-secret
        uses: aquasecurity/trivy-action@v0.69.3
        if: always()
        with:
          image-ref: 'local-build:latest'
          format: 'table'
          output: 'trivy-secret.txt'
          scanners: 'secret'
          exit-code: '0'
          timeout: '5m'

      - name: Display scan summary
        if: always()
        run: |
          echo "=== Security Scan Summary ==="
          echo "Image: local-build:latest"
          echo "Trivy Version: $TRIVY_VERSION"
          echo "Severity Level: ${{ github.event.inputs.severity || 'CRITICAL,HIGH' }}"
          echo "Ignore Unfixed: ${{ github.event.inputs.ignore_unfixed || true }}"
          echo "Exit Code: ${{ github.event.inputs.exit_code || '1' }}"
          echo "============================"
          
          if [ -f "trivy-results.sarif" ]; then
            echo "Vulnerability scan completed."
          else
            echo "No vulnerability scan results found."
          fi
          
          if [ -f "trivy-config.txt" ]; then
            echo "Configuration scan results:"
            head -20 trivy-config.txt || true
          fi
          
          if [ -f "trivy-secret.txt" ]; then
            echo "Secret scan results:"
            head -20 trivy-secret.txt || true
          fi

      - name: Generate security report
        if: always()
        run: |
          echo "# Security Scan Report" > security-report.md
          echo "" >> security-report.md
          echo "## Scan Details" >> security-report.md
          echo "- **Image**: local-build:latest" >> security-report.md
          echo "- **Scan Date**: $(date)" >> security-report.md
          echo "- **Trivy Version**: $TRIVY_VERSION" >> security-report.md
          echo "- **Severity Level**: ${{ github.event.inputs.severity || 'CRITICAL,HIGH' }}" >> security-report.md
          echo "" >> security-report.md
          
          if [ -f "trivy-results.sarif" ]; then
            echo "## Vulnerability Statistics" >> security-report.md
            echo "Vulnerability scan completed. Results uploaded to GitHub Security." >> security-report.md
            echo "" >> security-report.md
          fi
          
          if [ -f "trivy-config.txt" ] && [ -s "trivy-config.txt" ]; then
            echo "## Configuration Issues" >> security-report.md
            echo '```' >> security-report.md
            cat trivy-config.txt >> security-report.md
            echo '```' >> security-report.md
            echo "" >> security-report.md
          fi
          
          if [ -f "trivy-secret.txt" ] && [ -s "trivy-secret.txt" ]; then
            echo "## Secret Detection" >> security-report.md
            echo '```' >> security-report.md
            cat trivy-secret.txt >> security-report.md
            echo '```' >> security-report.md
            echo "" >> security-report.md
          fi
          
          echo "## Recommendations" >> security-report.md
          echo "1. Regularly update base image to get security patches" >> security-report.md
          echo "2. Review and fix HIGH and CRITICAL severity vulnerabilities" >> security-report.md
          echo "3. Remove unnecessary packages to reduce attack surface" >> security-report.md
          echo "4. Use specific version tags instead of 'latest'" >> security-report.md
          echo "5. Implement image signing and verification" >> security-report.md

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: |
            security-report.md
            trivy-config.txt
            trivy-secret.txt
          retention-days: 30

      - name: Notify on critical vulnerabilities
        if: failure() && steps.trivy-scan.outcome == 'failure'
        run: |
          echo "❌ Critical vulnerabilities found in the image!"
          echo "Please review the security scan report and fix the issues."
          echo ""
          echo "To fix vulnerabilities:"
          echo "1. Update base image to latest version"
          echo "2. Update packages with 'apt-get update && apt-get upgrade'"
          echo "3. Remove unnecessary packages"
          echo "4. Rebuild the image and run scan again"

      - name: Clean up
        if: always()
        run: |
          docker rmi local-build:latest 2>/dev/null || true
          rm -f trivy-results.sarif trivy-config.txt trivy-secret.txt security-report.md 2>/dev/null || true

  dependency-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency check tools
        run: |
          pip install safety bandit

      - name: Check Python dependencies
        run: |
          echo "=== Python Dependency Security Check ==="
          
          if [ -f "requirements.txt" ]; then
            echo "Checking requirements.txt..."
            safety check -r requirements.txt --json 2>/dev/null || safety check -r requirements.txt 2>/dev/null || echo "No issues found or safety check failed"
          else
            echo "No requirements.txt found"
          fi
          
          echo ""
          echo "=== Python Code Security Check ==="
          if [ -d "scripts" ]; then
            bandit -r scripts/ -f json 2>/dev/null || bandit -r scripts/ 2>/dev/null || echo "Bandit check completed"
          else
            echo "No scripts directory found"
          fi

      - name: Check shell scripts
        run: |
          echo "=== Shell Script Security Check ==="
          
          if command -v shellcheck &> /dev/null; then
            echo "Checking shell scripts with shellcheck..."
            find scripts/ -name \"*.sh\" -type f -exec shellcheck {} \; 2>/dev/null || echo "Shellcheck completed"
          else
            echo "Shellcheck not installed, skipping..."
          fi
          
          echo ""
          echo "=== Basic Script Checks ==="
          for script in scripts/*.sh; do
            if [ -f \"$script\" ]; then
              echo "Checking $script..."
              head -1 \"$script\" | grep -q \"^#!/bin/bash\" && echo \"  ✓ Has bash shebang\" || echo \"  ⚠️  Missing or incorrect shebang\"
              [ -x \"$script\" ] && echo \"  ✓ Is executable\" || echo \"  ⚠️  Not executable\"
            fi
          done

      - name: Generate dependency report
        run: |
          echo \"# Dependency Security Report\" > dependency-report.md
          echo \"\" >> dependency-report.md
          echo \"## Scan Details\" >> dependency-report.md
          echo \"- **Scan Date**: $(date)\" >> dependency-report.md
          echo \"- **Repository**: ${{ github.repository }}\" >> dependency-report.md
          echo \"\" >> dependency-report.md
          echo \"## Recommendations\" >> dependency-report.md
          echo \"1. Regularly update dependencies to latest secure versions\" >> dependency-report.md
          echo \"2. Use dependency vulnerability scanning in CI/CD\" >> dependency-report.md
          echo \"3. Review and fix security issues in shell scripts\" >> dependency-report.md
          echo \"4. Use signed and verified base images\" >> dependency-report.md

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-report
          path: dependency-report.md
          retention-days: 30