name: Build Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - '.github/workflows/build-image.yml'
      - 'config/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - '.github/workflows/build-image.yml'
      - 'config/**'
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        default: 'latest'
      android_version:
        description: 'Android SDK version'
        required: false
        default: '34'
      ndk_version:
        description: 'Android NDK version'
        required: false
        default: 'r26'
      gradle_version:
        description: 'Gradle version'
        required: false
        default: '8.5'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Set build arguments
        id: build-args
        run: |
          echo "UBUNTU_VERSION=24.04" >> $GITHUB_OUTPUT
          echo "JAVA_VERSION=17" >> $GITHUB_OUTPUT
          echo "PYTHON_VERSION=3.12" >> $GITHUB_OUTPUT
          echo "ANDROID_SDK_VERSION=${{ github.event.inputs.android_version || '34' }}" >> $GITHUB_OUTPUT
          echo "ANDROID_NDK_VERSION=${{ github.event.inputs.ndk_version || 'r26' }}" >> $GITHUB_OUTPUT
          echo "GRADLE_VERSION=${{ github.event.inputs.gradle_version || '8.5' }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UBUNTU_VERSION=${{ steps.build-args.outputs.UBUNTU_VERSION }}
            JAVA_VERSION=${{ steps.build-args.outputs.JAVA_VERSION }}
            PYTHON_VERSION=${{ steps.build-args.outputs.PYTHON_VERSION }}
            ANDROID_SDK_VERSION=${{ steps.build-args.outputs.ANDROID_SDK_VERSION }}
            ANDROID_NDK_VERSION=${{ steps.build-args.outputs.ANDROID_NDK_VERSION }}
            GRADLE_VERSION=${{ steps.build-args.outputs.GRADLE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Verify image
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker pull $IMAGE_TAG
          docker run --rm $IMAGE_TAG java -version
          docker run --rm $IMAGE_TAG gradle --version
          docker run --rm $IMAGE_TAG ccache --version

  test-image:
    needs: build-and-push
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test environment
        run: ./scripts/verify-env.sh

      - name: Test basic commands
        run: |
          java -version
          python3 --version
          git --version
          gradle --version
          ccache --version
          ninja --version

      - name: Test Android tools
        run: |
          sdkmanager --list | head -20
          echo "Android SDK installed at: $ANDROID_HOME"
          echo "Android NDK installed at: $ANDROID_NDK_HOME"

      - name: Test build capabilities
        run: |
          mkdir -p /tmp/test-project
          cd /tmp/test-project
          echo 'plugins { id "java" }' > build.gradle
          echo 'println "Gradle build test successful"' > build.gradle.kts 2>/dev/null || true
          if command -v javac &> /dev/null; then
            echo 'public class Test { public static void main(String[] args) { System.out.println("Java test successful"); } }' > Test.java
            javac Test.java
            java Test
          fi

  notify:
    needs: [build-and-push, test-image]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Notify on success
        if: ${{ needs.build-and-push.result == 'success' && needs.test-image.result == 'success' }}
        run: |
          echo "Docker image built and tested successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

      - name: Notify on failure
        if: ${{ needs.build-and-push.result == 'failure' || needs.test-image.result == 'failure' }}
        run: |
          echo "Docker image build or test failed!"
          echo "Check the workflow logs for details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
