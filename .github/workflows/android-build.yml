name: Android Build

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android '
        required: true
        default: '14'
        type: choice
        options:
          - '12'
          - '13'
          - '14'
          - '15'
      build_type:
        description: ''
        required: true
        default: 'app'
        type: choice
        options:
          - 'app'
          - 'system'
      enable_cache:
        description: ''
        required: false
        default: true
        type: boolean
      clean_build:
        description: ''
        required: false
        default: false
        type: boolean
      upload_artifacts:
        description: ''
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CCACHE_DIR: /ccache
  USE_CCACHE: 1

jobs:
  android-build:
    runs-on: ubuntu-latest
    container:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      options: --user root
      volumes:
        - /tmp/ccache:/ccache

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          # 
          echo "ANDROID_VERSION=${{ github.event.inputs.android_version }}" >> $GITHUB_ENV
          echo "BUILD_TYPE=${{ github.event.inputs.build_type }}" >> $GITHUB_ENV
          echo "ENABLE_CACHE=${{ github.event.inputs.enable_cache }}" >> $GITHUB_ENV
          echo "CLEAN_BUILD=${{ github.event.inputs.clean_build }}" >> $GITHUB_ENV
          
          # 
          echo "=== Build Environment ==="
          echo "Android Version: ${{ github.event.inputs.android_version }}"
          echo "Build Type: ${{ github.event.inputs.build_type }}"
          echo "Enable Cache: ${{ github.event.inputs.enable_cache }}"
          echo "Clean Build: ${{ github.event.inputs.clean_build }}"
          echo "========================="

      - name: Restore ccache cache
        if: ${{ github.event.inputs.enable_cache }}
        uses: actions/cache@v3
        with:
          path: /ccache
          key: ${{ runner.os }}-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Restore Gradle cache
        if: ${{ github.event.inputs.enable_cache }}
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup ccache
        if: ${{ github.event.inputs.enable_cache }}
        run: |
          #  ccache
          ccache -M 50G
          ccache -o compression=true
          ccache -o compression_level=6
          ccache -s

      - name: Verify build environment
        run: |
          # 
          ./scripts/verify-env.sh

      - name: Clean build directory
        if: ${{ github.event.inputs.clean_build }}
        run: |
          echo "Cleaning build directory..."
          rm -rf build/ out/ app/build/ .gradle/
          ./scripts/clean-cache.sh --all

      - name: Build Android Application
        if: ${{ github.event.inputs.build_type == 'app' }}
        run: |
          echo "Building Android Application for Android ${{ github.event.inputs.android_version }}..."
          
          #  Android ?          if [ ! -f "build.gradle" ] && [ ! -f "app/build.gradle" ]; then
            echo "Creating sample Android project..."
            
            # 
            mkdir -p app/src/main/java/com/example/app
            mkdir -p app/src/main/res/layout
            mkdir -p app/src/main/res/values
            
            #  build.gradle 
            cat > build.gradle << 'EOF'
            // Top-level build file
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath 'com.android.tools.build:gradle:8.2.0'
                }
            }
            
            allprojects {
                repositories {
                    google()
                    mavenCentral()
                }
            }
            
            task clean(type: Delete) {
                delete rootProject.buildDir
            }
            EOF
            
            #  app/build.gradle 
            cat > app/build.gradle << 'EOF'
            plugins {
                id 'com.android.application'
            }
            
            android {
                namespace 'com.example.app'
                compileSdk 34
            
                defaultConfig {
                    applicationId "com.example.app"
                    minSdk 24
                    targetSdk 34
                    versionCode 1
                    versionName "1.0"
                }
            
                buildTypes {
                    release {
                        minifyEnabled false
                        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                    }
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            
            dependencies {
                implementation 'androidx.appcompat:appcompat:1.6.1'
                implementation 'com.google.android.material:material:1.10.0'
                implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            }
            EOF
            
            #  MainActivity
            cat > app/src/main/java/com/example/app/MainActivity.java << 'EOF'
            package com.example.app;
            
            import androidx.appcompat.app.AppCompatActivity;
            import android.os.Bundle;
            
            public class MainActivity extends AppCompatActivity {
                @Override
                protected void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    setContentView(R.layout.activity_main);
                }
            }
            EOF
            
            # 
            cat > app/src/main/res/layout/activity_main.xml << 'EOF'
            <?xml version="1.0" encoding="utf-8"?>
            <androidx.constraintlayout.widget.ConstraintLayout
                xmlns:android="http://schemas.android.com/apk/res/android"
                xmlns:app="http://schemas.android.com/apk/res-auto"
                xmlns:tools="http://schemas.android.com/tools"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                tools:context=".MainActivity">
            
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Hello Android!"
                    app:layout_constraintBottom_toBottomOf="parent"
                    app:layout_constraintLeft_toLeftOf="parent"
                    app:layout_constraintRight_toRightOf="parent"
                    app:layout_constraintTop_toTopOf="parent" />
            
            </androidx.constraintlayout.widget.ConstraintLayout>
            EOF
            
            #  strings.xml
            cat > app/src/main/res/values/strings.xml << 'EOF'
            <resources>
                <string name="app_name">Android Build Test</string>
            </resources>
            EOF
            
            #  AndroidManifest.xml
            cat > app/src/main/AndroidManifest.xml << 'EOF'
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            
                <application
                    android:allowBackup="true"
                    android:icon="@mipmap/ic_launcher"
                    android:label="@string/app_name"
                    android:roundIcon="@mipmap/ic_launcher_round"
                    android:supportsRtl="true"
                    android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                    <activity
                        android:name=".MainActivity"
                        android:exported="true">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>
            
            </manifest>
            EOF
          fi
          
          #  APK
          echo "Building APK..."
          chmod +x gradlew 2>/dev/null || ./gradlew wrapper 2>/dev/null || true
          
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --console=plain
          else
            gradle assembleDebug --no-daemon --console=plain
          fi
          
          # ?          if [ -d "app/build/outputs/apk" ]; then
            echo "?APK built successfully!"
            find app/build/outputs/apk -name "*.apk" | head -5
          else
            echo "  No APK found in app/build/outputs/apk"
          fi

      - name: Build Android System (AOSP)
        if: ${{ github.event.inputs.build_type == 'system' }}
        run: |
          echo "Building Android System (AOSP) for Android ${{ github.event.inputs.android_version }}..."
          
          #  AOSP ?          # 
          echo "This would build Android ${{ github.event.inputs.android_version }} AOSP"
          echo "For full AOSP build, you need to sync the source code first:"
          echo "  repo init -u https://android.googlesource.com/platform/manifest -b android-${{ github.event.inputs.android_version }}.0_r1"
          echo "  repo sync -j8"
          echo "  source build/envsetup.sh"
          echo "  lunch aosp_arm-eng"
          echo "  make -j\$(nproc)"
          
          # 
          echo "Verifying AOSP build environment..."
          which make && make --version
          which ninja && ninja --version
          which java && java -version
          which python3 && python3 --version
          
          echo "?AOSP build environment is ready!"

      - name: Save ccache cache
        if: ${{ github.event.inputs.enable_cache }}
        uses: actions/cache@v3
        with:
          path: /ccache
          key: ${{ runner.os }}-ccache-${{ github.run_id }}

      - name: Save Gradle cache
        if: ${{ github.event.inputs.enable_cache }}
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Upload build artifacts
        if: ${{ github.event.inputs.upload_artifacts && github.event.inputs.build_type == 'app' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            app/build/outputs/apk/
            app/build/outputs/bundle/
            build/reports/
          retention-days: 7

      - name: Show ccache statistics
        if: ${{ github.event.inputs.enable_cache }}
        run: |
          echo "=== ccache Statistics ==="
          ccache -s
          echo "========================"

      - name: Build summary
        run: |
          echo "=== Build Summary ==="
          echo "Build Type: ${{ github.event.inputs.build_type }}"
          echo "Android Version: ${{ github.event.inputs.android_version }}"
          echo "Cache Enabled: ${{ github.event.inputs.enable_cache }}"
          echo "Clean Build: ${{ github.event.inputs.clean_build }}"
          echo "Status: ${{ job.status }}"
          echo "====================="
          
          # 
          echo "Build completed at: $(date)"
          
          # 
          echo "Disk usage:"
          df -h /ccache ~/.gradle 2>/dev/null || true