# ============================================
# Docker 构建参数配置
# ============================================
#
# 用于自定义 Docker 镜像构建的参数
# 可以在构建时通过 --build-arg 覆盖这些值
#
# 使用示例:
#   docker build --build-arg UBUNTU_VERSION=24.10 --build-arg JAVA_VERSION=17 .
#
# ============================================

# 基础镜像版本
UBUNTU_VERSION=24.10
UBUNTU_CODENAME=oracular
UBUNTU_RELEASE=24.10

# Java 版本
JAVA_VERSION=17
JAVA_DISTRIBUTION=openjdk
JAVA_VENDOR=ubuntu

# Python 版本
PYTHON_VERSION=3.12
PYTHON_MAJOR_VERSION=3
PYTHON_MINOR_VERSION=12

# Android SDK 版本
ANDROID_SDK_VERSION=34
ANDROID_SDK_TOOLS_VERSION=11079833
ANDROID_SDK_BUILD_TOOLS_VERSION=34.0.0
ANDROID_SDK_PLATFORM_TOOLS_VERSION=34.0.5

# Android NDK 版本
ANDROID_NDK_VERSION=r26
ANDROID_NDK_REVISION=26.1.10909125
ANDROID_NDK_API_LEVEL=21

# Gradle 版本
GRADLE_VERSION=8.5
GRADLE_DISTRIBUTION_TYPE=bin

# 构建工具版本
CCACHE_VERSION=4.9
NINJA_VERSION=1.11.1
REPO_VERSION=2.37

# 系统包版本
BUILD_ESSENTIAL_VERSION=12.10
GIT_VERSION=1:2.43.0
CURL_VERSION=7.88.1
WGET_VERSION=1.21.3
UNZIP_VERSION=6.0

# 镜像元数据
MAINTAINER="Android Build Team"
VERSION=1.0.0
DESCRIPTION="Docker image for Android system and application compilation"
URL="https://github.com/your-org/android-build-docker"
VENDOR="Android Build Team"
LICENSE="Apache-2.0"

# 构建优化参数
APT_CACHE_DIR=/var/cache/apt
APT_UPDATE_INTERVAL=86400
APT_CLEAN_AFTER_INSTALL=true
APT_KEEP_CACHE=false

# 安全参数
NON_ROOT_USER=builder
NON_ROOT_UID=1000
NON_ROOT_GID=1000
DISABLE_ROOT=true
REMOVE_SUDO=true

# 网络参数
HTTP_PROXY=
HTTPS_PROXY=
NO_PROXY=localhost,127.0.0.1
HTTP_TIMEOUT=300
CONNECT_TIMEOUT=30

# 镜像源（用于加速下载）
APT_MIRROR=
PYPI_MIRROR=
GRADLE_MIRROR=
ANDROID_SDK_MIRROR=

# 构建阶段控制
ENABLE_BUILDER_STAGE=true
ENABLE_RUNTIME_STAGE=true
ENABLE_TEST_STAGE=false
ENABLE_DEBUG_STAGE=false

# 功能开关
ENABLE_JAVA=true
ENABLE_PYTHON=true
ENABLE_ANDROID_SDK=true
ENABLE_ANDROID_NDK=true
ENABLE_GRADLE=true
ENABLE_CCACHE=true
ENABLE_NINJA=true
ENABLE_REPO=true

# 调试选项
DEBUG=false
VERBOSE=false
KEEP_TEMP_FILES=false
PRINT_COMMANDS=false

# 性能优化
PARALLEL_BUILD=true
PARALLEL_JOBS=$(nproc)
COMPRESS_LAYERS=true
SQUASH_LAYERS=false
OPTIMIZE_SIZE=true

# 健康检查配置
HEALTHCHECK_INTERVAL=30s
HEALTHCHECK_TIMEOUT=10s
HEALTHCHECK_START_PERIOD=5s
HEALTHCHECK_RETRIES=3
HEALTHCHECK_CMD="python3 -c \"import sys; sys.exit(0)\""

# 标签配置
LABEL_SCHEMA_VERSION=1.0
LABEL_BUILD_DATE=
LABEL_VCS_REF=
LABEL_VCS_URL=

# 输出配置
OUTPUT_TYPE=docker
OUTPUT_DEST=.
OUTPUT_COMPRESSION=zstd
OUTPUT_PLATFORM=linux/amd64

# 缓存配置
CACHE_FROM=type=local,src=.buildcache
CACHE_TO=type=local,dest=.buildcache,mode=max
CACHE_TTL=168h

# 实验性功能
EXPERIMENTAL_PLATFORMS=linux/arm64,linux/amd64
EXPERIMENTAL_FEATURES=
EXPERIMENTAL_OPTIONS=

# 构建后操作
POST_BUILD_CLEANUP=true
POST_BUILD_TEST=true
POST_BUILD_SCAN=true
POST_BUILD_PUSH=false

# 验证配置
VALIDATE_IMAGE=true
VALIDATE_TOOLS=true
VALIDATE_VERSIONS=true
VALIDATE_SECURITY=true

# ============================================
# 参数验证规则
# ============================================

# Java 版本验证
JAVA_VERSION_VALID_VALUES=11,17,21
JAVA_VERSION_DEFAULT=17
JAVA_VERSION_MIN=11
JAVA_VERSION_MAX=21

# Android SDK 版本验证
ANDROID_SDK_VERSION_VALID_VALUES=30,31,32,33,34,35
ANDROID_SDK_VERSION_DEFAULT=34
ANDROID_SDK_VERSION_MIN=30
ANDROID_SDK_VERSION_MAX=35

# Android NDK 版本验证
ANDROID_NDK_VERSION_VALID_VALUES=r25,r26,r27
ANDROID_NDK_VERSION_DEFAULT=r26
ANDROID_NDK_VERSION_MIN=r25
ANDROID_NDK_VERSION_MAX=r27

# Gradle 版本验证
GRADLE_VERSION_VALID_VALUES=8.0,8.1,8.2,8.3,8.4,8.5,8.6
GRADLE_VERSION_DEFAULT=8.5
GRADLE_VERSION_MIN=8.0
GRADLE_VERSION_MAX=8.6

# Ubuntu 版本验证
UBUNTU_VERSION_VALID_VALUES=22.04,24.04,24.10
UBUNTU_VERSION_DEFAULT=24.10
UBUNTU_VERSION_MIN=22.04
UBUNTU_VERSION_MAX=24.10

# ============================================
# 环境变量映射
# ============================================

# 构建参数到环境变量的映射
ARG_TO_ENV_MAPPING='
UBUNTU_VERSION->UBUNTU_VERSION
JAVA_VERSION->JAVA_VERSION
PYTHON_VERSION->PYTHON_VERSION
ANDROID_SDK_VERSION->ANDROID_SDK_VERSION
ANDROID_NDK_VERSION->ANDROID_NDK_VERSION
GRADLE_VERSION->GRADLE_VERSION
'

# 默认值回退
DEFAULT_VALUE_FALLBACK='
JAVA_VERSION=17->21->11
ANDROID_SDK_VERSION=34->33->32
ANDROID_NDK_VERSION=r26->r25->r24
GRADLE_VERSION=8.5->8.4->8.3
'

# ============================================
# 使用示例
# ============================================

# 示例 1: 使用默认值构建
# docker build -t android-build:latest .

# 示例 2: 自定义 Java 和 Android SDK 版本
# docker build \
#   --build-arg JAVA_VERSION=21 \
#   --build-arg ANDROID_SDK_VERSION=35 \
#   --build-arg ANDROID_NDK_VERSION=r27 \
#   -t android-build:custom .

# 示例 3: 使用代理构建
# docker build \
#   --build-arg HTTP_PROXY=http://proxy.example.com:8080 \
#   --build-arg HTTPS_PROXY=http://proxy.example.com:8080 \
#   -t android-build:proxy .

# 示例 4: 禁用缓存构建
# docker build \
#   --build-arg ENABLE_CCACHE=false \
#   --no-cache \
#   -t android-build:nocache .

# 示例 5: 多平台构建
# docker buildx build \
#   --platform linux/amd64,linux/arm64 \
#   --build-arg EXPERIMENTAL_PLATFORMS=linux/amd64,linux/arm64 \
#   -t android-build:multiarch .